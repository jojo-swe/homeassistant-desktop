name: Build & release

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release for the version in package.json (creates the v<version> tag on this commit)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  # Never cancel a run that may be publishing a release.
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve version and release mode
        id: version
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          PUBLISH=false
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
              exit 1
            fi
            PUBLISH=true
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$RELEASE_INPUT" = "true" ]; then
            if [ "$GITHUB_REF" != "refs/heads/master" ]; then
              echo "::error::Releases can only be published from master (got $GITHUB_REF)"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
              echo "::error::Tag v$VERSION already exists — bump the version in package.json first"
              exit 1
            fi
            PUBLISH=true
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, publish=$PUBLISH"

      - name: Check release notes exist
        if: steps.version.outputs.publish == 'true'
        run: node scripts/release-notes.cjs "${{ steps.version.outputs.version }}" > /dev/null

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint:check

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows and macOS build both architectures in one job so electron-builder writes a single
          # latest.yml / latest-mac.yml covering both; separate jobs would overwrite each other's.
          - name: Windows (x64 + arm64)
            os: windows-latest
            artifact: windows
          - name: macOS (Intel + Apple Silicon)
            os: macos-15
            artifact: macos
          # Linux manifests are already per-arch (latest-linux.yml / latest-linux-arm64.yml).
          - name: Linux x64
            os: ubuntu-latest
            arch: x64
            artifact: linux-x64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            arch: arm64
            artifact: linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools dpkg rpm fakeroot

      - name: Build application
        run: npm run build:dir

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: npx electron-builder --win nsis zip portable --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package macOS
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg zip --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package Linux
        if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage deb rpm --${{ matrix.arch }} --publish never

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: home-assistant-desktop-${{ matrix.artifact }}-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    if: needs.validate.outputs.publish == 'true'
    needs: [validate, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: home-assistant-desktop-*
          path: artifacts

      - name: Collect assets and verify update manifests
        run: node scripts/prepare-release-assets.cjs artifacts release-assets

      - name: Extract release notes
        run: node scripts/release-notes.cjs "$VERSION" > release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: v${{ env.VERSION }}
          body_path: release-notes.md
          prerelease: ${{ contains(env.VERSION, '-') }}
          make_latest: ${{ !contains(env.VERSION, '-') }}
          fail_on_unmatched_files: true
          files: release-assets/*
